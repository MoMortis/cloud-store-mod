apply plugin: net.fabricmc.loom.LoomGradlePlugin

version = '1.0'
group = 'com.cloudstore'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://masa.dy.fi/maven/' }
}

loom {
    mods {
        cloudstore {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java.srcDirs = ['src-live/main/java']
        java.exclude 'com/cloudstore/client/screen/ConfigScreen.java'
        resources.srcDirs = ['src-live/main/resources']
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    compileOnly files('D:/SSS/BetterBundleHUDMod-main/build/loom-cache/remapped_working/remapped.net.fabricmc.fabric-api-fabric-api-4b5d3c0a-0.141.4+1.21.11.jar')
    compileOnly files('D:/SSS/BetterBundleHUDMod-main/build/loom-cache/remapped_working/remapped.net.fabricmc.fabric-api-fabric-lifecycle-events-v1-4b5d3c0a-2.6.15+4ebb5c083e.jar')
    compileOnly files('D:/SSS/BetterBundleHUDMod-main/build/loom-cache/remapped_working/remapped.net.fabricmc.fabric-api-fabric-key-binding-api-v1-4b5d3c0a-1.1.7+4fc5413f3e.jar')
    compileOnly files('D:/SSS/BetterBundleHUDMod-main/build/loom-cache/remapped_working/remapped.net.fabricmc.fabric-api-fabric-api-base-4b5d3c0a-1.0.5+4ebb5c083e.jar')
    compileOnly files('D:/SSS/BetterBundleHUDMod-main/build/loom-cache/remapped_working/remapped.net.fabricmc.fabric-api-fabric-networking-api-v1-4b5d3c0a-5.1.6+6b6d71a53e.jar')
    // 投影模组改用自制分支 litematica-DSH（1.21.11 版）；modCompileOnly 让 loom 把它的中间名映射重映射为本工程的 Yarn 命名
    modCompileOnly files('D:/SSS/litematica-DSH/litematica-DSH.jar')
    compileOnly files('D:/SSS/Cloud-Store/cloud-store-mod-26.2/versions/1.21.11/.gradle/loom-cache/remapped_mods/remapped/unspecified/malilib-fabric-1.21.11-0.27.16-4b5d3c0a/49d6d9ca27/malilib-fabric-1.21.11-0.27.16-4b5d3c0a-49d6d9ca27.jar')
    implementation files('C:/Users/Tlipoca/.gradle/caches/modules-2/files-2.1/com.belerweb/pinyin4j/2.5.1/ea23babfc45a078af5b73cd9f3401caad1f1b2a9/pinyin4j-2.5.1.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
        filter { line ->
            if (line.contains('"authors"')) return '  "authors": ["PetraSM", "Damomo1"],'
            if (line.contains('"contact"') || line.contains('"license"')) return ''
            if (line.contains('"fabric-api"')) return '    "fabric-api": "*",\n    "litematica": ">=0.26.12"'
            return line
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from {
        configurations.runtimeClasspath.findAll { it.name.startsWith('pinyin4j-') }.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    archiveFileName = 'cloud-store-1.21.11.jar'
}

tasks.register('collectRootJar', Copy) {
    doNotTrackState('The destination is the shared workspace root.')
    dependsOn remapJar
    from remapJar.archiveFile
    into 'D:/SSS'
}
